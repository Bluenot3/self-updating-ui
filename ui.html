    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // --- 2. Icon Utilities (Safe Adapter) ---
        const Icon = ({ name, size = 24, className, ...props }) => {
            const lucide = window.lucide;
            if (!lucide || !lucide.icons || !lucide.icons[name]) return null;
            const iconData = lucide.icons[name];
            const [tag, attrs, children] = iconData;
            return React.createElement('svg', 
                { ...attrs, ...props, width: size, height: size, className: className, stroke: "currentColor" },
                children ? children.map(([childTag, childAttrs], i) => React.createElement(childTag, { ...childAttrs, key: i })) : null
            );
        };

        // Icons
        const Rocket = (p) => <Icon name="Rocket" {...p} />;
        const Zap = (p) => <Icon name="Zap" {...p} />;
        const Globe = (p) => <Icon name="Globe" {...p} />;
        const Shield = (p) => <Icon name="Shield" {...p} />;
        const Hexagon = (p) => <Icon name="Hexagon" {...p} />;
        const Activity = (p) => <Icon name="Activity" {...p} />;
        const Play = (p) => <Icon name="Play" {...p} />;
        const Pause = (p) => <Icon name="Pause" {...p} />;
        const Cpu = (p) => <Icon name="Cpu" {...p} />;
        const ArrowRight = (p) => <Icon name="ArrowRight" {...p} />;

        // --- 3. Robust Three.js Engine (ResizeObserver) ---
        const ThreeBackground = ({ config, color }) => {
            const mountRef = useRef(null);
            
            useEffect(() => {
                if (!mountRef.current || !window.THREE) return;
                const THREE = window.THREE;

                // Scene Setup
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, mountRef.current.clientWidth / mountRef.current.clientHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
                
                renderer.setSize(mountRef.current.clientWidth, mountRef.current.clientHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limit pixel ratio for performance
                
                // Cleanup previous canvas
                while(mountRef.current.firstChild) mountRef.current.removeChild(mountRef.current.firstChild);
                mountRef.current.appendChild(renderer.domElement);

                // Geometry Logic
                const group = new THREE.Group();
                let geometry, particles;
                
                // Color Extraction
                let hex = 0xffffff;
                if (color.includes('cyan')) hex = 0x06b6d4;
                else if (color.includes('purple')) hex = 0x9333ea;
                else if (color.includes('blue')) hex = 0x2563eb;
                else if (color.includes('green')) hex = 0x10b981;
                else if (color.includes('red')) hex = 0xef4444;
                else if (color.includes('yellow')) hex = 0xeab308;
                else if (color.includes('orange')) hex = 0xf97316;
                else if (color.includes('pink')) hex = 0xec4899;
                else if (color.includes('slate')) hex = 0x64748b;

                const material = new THREE.MeshBasicMaterial({ color: hex, wireframe: config.wireframe, transparent: true, opacity: 0.25 });

                // Shape Generation
                if (config.shape === 'torus') geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
                else if (config.shape === 'icosahedron') geometry = new THREE.IcosahedronGeometry(12, 1);
                else if (config.shape === 'grid') {
                    geometry = new THREE.PlaneGeometry(80, 80, 40, 40);
                    material.wireframe = true;
                    material.opacity = 0.15;
                }
                else if (config.shape === 'cubes') {
                    for (let i = 0; i < 30; i++) {
                        const m = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), material);
                        m.position.set((Math.random()-0.5)*50, (Math.random()-0.5)*50, (Math.random()-0.5)*20);
                        m.rotation.set(Math.random(), Math.random(), Math.random());
                        group.add(m);
                    }
                }
                else if (config.shape === 'rings') {
                    group.add(new THREE.Mesh(new THREE.TorusGeometry(15, 0.2, 16, 100), material));
                    group.add(new THREE.Mesh(new THREE.TorusGeometry(25, 0.2, 16, 100), material));
                    group.rotation.x = 1.2;
                }
                else if (config.shape === 'helix') {
                    const points = [];
                    for (let i = 0; i < 150; i++) {
                        const t = i * 0.4;
                        points.push(new THREE.Vector3(Math.cos(t)*6, t-30, Math.sin(t)*6));
                        points.push(new THREE.Vector3(Math.cos(t+Math.PI)*6, t-30, Math.sin(t+Math.PI)*6));
                    }
                    const m = new THREE.Points(new THREE.BufferGeometry().setFromPoints(points), new THREE.PointsMaterial({ color: hex, size: 0.4 }));
                    group.add(m);
                }
                else if (config.shape === 'rain' || config.shape === 'particles') {
                    geometry = new THREE.BufferGeometry();
                    const count = config.shape === 'rain' ? 1200 : 800;
                    const pos = new Float32Array(count * 3);
                    for(let i=0; i<count*3; i++) pos[i] = (Math.random()-0.5) * (config.shape === 'rain' ? 100 : 70);
                    geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                    particles = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.25, color: hex }));
                    scene.add(particles);
                }

                if (geometry && !particles && group.children.length === 0) {
                    group.add(new THREE.Mesh(geometry, material));
                }
                if (group.children.length > 0) scene.add(group);
                
                camera.position.z = 40;

                // Animation Loop
                let reqId;
                const animate = () => {
                    reqId = requestAnimationFrame(animate);
                    
                    if (group) {
                        group.rotation.x += 0.002 * config.speed;
                        group.rotation.y += 0.005 * config.speed;
                    }
                    if (config.shape === 'grid' && group.children[0]) {
                        group.rotation.x = 1.6;
                        group.position.y = -10;
                        group.rotation.z += 0.002;
                    }
                    if ((config.shape === 'rain' || config.shape === 'particles') && particles) {
                        const positions = particles.geometry.attributes.position.array;
                        const dropSpeed = config.shape === 'rain' ? 0.8 : 0.1;
                        for(let i=1; i<positions.length; i+=3) {
                            positions[i] -= dropSpeed * config.speed;
                            if (positions[i] < -50) positions[i] = 50;
                        }
                        particles.geometry.attributes.position.needsUpdate = true;
                        if (config.shape !== 'rain') particles.rotation.y += 0.001 * config.speed;
                    }
                    renderer.render(scene, camera);
                };
                animate();

                // Robust Resize Observer (Fixes the shaking/sizing issue)
                const resizeObserver = new ResizeObserver(entries => {
                    for (let entry of entries) {
                        const { width, height } = entry.contentRect;
                        camera.aspect = width / height;
                        camera.updateProjectionMatrix();
                        renderer.setSize(width, height);
                    }
                });
                
                if (mountRef.current) resizeObserver.observe(mountRef.current);

                return () => {
                    cancelAnimationFrame(reqId);
                    resizeObserver.disconnect();
                    if (mountRef.current) mountRef.current.innerHTML = '';
                    geometry?.dispose();
                    material?.dispose();
                };
            }, [config, color]); // Re-run when config changes

            return <div ref={mountRef} className="absolute inset-0 z-0 opacity-100 pointer-events-none transition-opacity duration-1000" />;
        };
